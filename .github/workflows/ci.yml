# 推送/PR 时自动跑：类型检查、Biome 检查、测试、构建
# 公开仓库免费且不限时长：https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint & format (Biome)
        run: pnpm exec biome check .
        # CI 不加 --write，有问题直接失败

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
