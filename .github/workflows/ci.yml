# 推送/PR 时自动跑：类型检查、Rslint、格式检查、测试、构建
# 公开仓库免费且不限时长：https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install household server
        run: pnpm --dir server install --frozen-lockfile

      - name: Check
        run: pnpm exec rs lint --type-check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check household server
        run: pnpm --dir server typecheck

      - name: Build household server
        run: pnpm --dir server build
