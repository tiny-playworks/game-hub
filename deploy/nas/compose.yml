# Template only. Confirm NAS mounts, port and CPU architecture before use.
services:
  game-hub-static:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '${GAME_HUB_PORT:-8089}:80'
    volumes:
      - '${GAME_HUB_ROOT:-/volume1/docker/game-hub}:/srv/game-hub:ro'
      - './nginx.household.conf:/etc/nginx/conf.d/default.conf:ro'
    depends_on:
      game-hub-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

  game-hub-api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      GAME_HUB_DB_PATH: /data/household.sqlite
      GAME_HUB_PORT: '8787'
      GAME_HUB_TRUST_PROXY: '1'
    volumes:
      - '${GAME_HUB_ROOT:-/volume1/docker/game-hub}/data:/data'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8787/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
